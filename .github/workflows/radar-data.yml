name: radar-data
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build radar snapshots
        run: node scripts/build-static.mjs
      - name: commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): hourly radar snapshot"
            git push
          else
            echo "no material change, skipping commit"
          fi
