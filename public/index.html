<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TerraSignal — EO Demand Radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">◉</span>
    <h1>TerraSignal<span class="sub">EO Demand Radar</span></h1>
  </div>
  <div class="controls">
    <div class="seg" id="region">
      <button data-v="eu" class="on">Europe</button>
      <button data-v="global">Global</button>
    </div>
    <select id="days" title="events opened within">
      <option value="30">last 30d</option>
      <option value="45" selected>last 45d</option>
    </select>
    <button id="refresh" title="re-scan">⟳</button>
    <button id="pinBtn" title="place a pin: click the map to score a custom AOI (needs live server)">📍 pin</button>
    <label class="radiusCtl" title="AOI radius around the pin">
      r <input id="radius" type="range" min="2" max="50" step="1" value="10" />
      <span id="radiusVal">10 km</span>
    </label>
    <button id="pinClear" class="hidden" title="remove pin">✕</button>
  </div>
</header>

<main>
  <aside id="side">
    <div class="kpis" id="kpis"></div>
    <div class="legend">
      <span><i class="dot gap"></i>tasking gap — no fresh clear free data</span>
      <span><i class="dot partial"></i>partial coverage</span>
      <span><i class="dot ready"></i>Copernicus-ready — service today</span>
      <span><i class="dot sat"></i>live Sentinel positions (propagated TLEs)</span>
      <span><i class="dot pin"></i>custom pin AOI (📍 pin → click map, drag slider for radius)</span>
    </div>
    <div class="asof" id="asof"></div>
    <div id="list" class="list"><div class="rows skeleton">scanning Copernicus catalogue…</div></div>
  </aside>
  <div id="map"></div>
</main>

<div id="err" class="err hidden"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script src="app.js"></script>
</body>
</html>
